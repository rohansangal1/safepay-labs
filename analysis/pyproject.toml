[project]
name = "piaslab-analysis"
version = "0.1.0"
description = "Analysis for the Payment Integration Lab: reads data/runs, computes prevalence intervals."
requires-python = "==3.12.*"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.7,<1",
]

# This is a workspace of scripts and modules, not a package to build/distribute, so uv installs only
# the dependencies (no build backend). Tests and tools import `piaslab` from source via pythonpath.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
