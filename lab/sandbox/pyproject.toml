[project]
name = "safepay-sandbox"
version = "0.1.0"
description = "Django payments sandbox for SafePay Labs Track B: double-entry ledger, intents, refunds, payouts."
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120,<7",
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.7,<1",
]

# A Django project run from source, not a package to build (same convention as analysis/).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sandbox.settings"
testpaths = ["tests"]
pythonpath = ["."]
