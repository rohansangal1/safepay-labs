<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · SafePay Labs</title>
  <meta name="theme-color" content="#f3ede2">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    /* Self-contained on purpose: nothing else from the portal is readable before sign-in.
       Colours and type mirror site/style.css; the fonts and favicon are public files. */
    @font-face {
      font-family: "Inter"; font-style: normal; font-weight: 400 800; font-display: swap;
      src: url("/assets/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("/assets/fonts/instrument-serif-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap;
      src: url("/assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
    }
    :root {
      color-scheme: light;
      --bg: #f3ede2; --surface: #fbf8f2; --surface-2: #ebe3d4; --border: rgba(20, 18, 16, 0.12);
      --text: #141210; --text-2: #4b453d; --muted: #756c61; --on-dark: #f3ede2;
      --accent: #2846f0; --accent-on-dark: #8c9fff;
      --critical-ink: #9c2c1f; --critical-soft: rgba(200, 69, 47, 0.1);
      --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text);
      font: 15px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent); color: #fff; }
    main { width: min(100%, 400px); display: grid; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 30px; height: 30px; flex: none; }
    .logo-tile { fill: var(--text); }
    .logo-ring { fill: none; stroke: var(--on-dark); stroke-width: 1.6; stroke-linecap: round; }
    .logo-ring.back { opacity: 0.45; }
    .logo-core { fill: var(--on-dark); stroke: var(--text); stroke-width: 2; }
    .logo-dot { fill: var(--accent-on-dark); }
    .brand-name { font: 400 25px/1.2 var(--serif); letter-spacing: -0.01em; }
    .brand-name em { font-style: italic; color: var(--accent); }
    form {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px; display: grid; gap: 16px;
      box-shadow: 0 1px 2px rgba(20, 18, 16, 0.05), 0 12px 40px -18px rgba(20, 18, 16, 0.18);
    }
    h1 { margin: 0 0 4px; font: 400 38px/1.05 var(--serif); letter-spacing: -0.02em; }
    p { margin: 0; color: var(--text-2); }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 550; }
    input {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; width: 100%;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      font: inherit; font-weight: 540; color: var(--on-dark); background: var(--text);
      border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer;
    }
    button:hover { background: var(--accent); }
    .error {
      color: var(--critical-ink); background: var(--critical-soft);
      border-radius: 12px; padding: 8px 14px; font-size: 14px;
    }
    .hint { font-size: 13px; color: var(--muted); }
    .local { font-size: 14px; background: var(--surface-2); border-radius: 12px; padding: 8px 14px; }
    .local code { font: 13px ui-monospace, "SF Mono", Menlo, monospace; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" class="logo-tile"/><g transform="rotate(-28 16 16)"><ellipse cx="16" cy="16" rx="12" ry="6.2" class="logo-ring back"/></g><circle cx="16" cy="16" r="4.6" class="logo-core"/><g transform="rotate(-28 16 16)"><path d="M28 16A12 6.2 0 0 1 4 16" class="logo-ring"/><circle cx="28" cy="16" r="1.8" class="logo-dot"/></g></svg><span class="brand-name">Safe<em>Pay</em> Labs</span></div>
    <form method="post" action="/devs/login">
      <div>
        <h1>Dev sign in</h1>
        <p>For project researchers. You stay signed in on this browser.</p>
      </div>
      <!--message-->
      <label>Email
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">No account? Ask a project researcher to create one. <a href="/">Back to the public site</a></p>
  </main>
</body>
</html>
