name: Analysis checks
# Python analysis (analysis/). Reproducible from the committed uv.lock, independent of the Node CI.
on:
  push:
    paths:
      - 'analysis/**'
      - 'data/runs/**'
      - '.github/workflows/analysis.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'data/runs/**'
      - '.github/workflows/analysis.yml'
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install uv via its official script (no third-party action to pin); the lockfile, not the
      # uv version, fixes dependency versions. Python 3.12 comes from .python-version.
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
